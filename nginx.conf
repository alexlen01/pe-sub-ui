# Serves the built SPA and proxies /api to the pe-sub-api ClusterIP service.
# In AKS the ingress routes /api to pe-sub-api directly; this proxy makes the
# container self-sufficient on a local cluster (NodePort, no ingress) as well.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Probe endpoint for Kubernetes liveness/readiness.
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://pe-sub-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m; # multipart uploads (BB schedules)
        # SSE (/api/notifications): disable buffering so events flush immediately.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
